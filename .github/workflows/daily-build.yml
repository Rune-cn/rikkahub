name: Daily Build

on:
  # 推送到 master 时自动构建 APK
  push:
    branches: [master]
  # 每天 UTC 09:00、18:00 触发（北京时间 17:00、次日 02:00）
  schedule:
    - cron: '0 9,18 * * *'
  # 也支持手动触发
  workflow_dispatch:

jobs:
  # 检查过去 24 小时内是否有新提交，没有则跳过构建，避免重复打包
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          # 手动触发时无条件构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定时触发：仅当过去 24 小时内有新提交才构建
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          # 解码base64编码的keystore文件
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key

          # 写入签名配置到local.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties

          # 可选：存在 Google Services 配置才写入（没有也能构建，Firebase 功能会被禁用）
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          fi

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # 计算版本号：应用版本 + 构建 commit 短 SHA（如 2.5.6-a3ea1cd1）
      - name: Compute release version
        id: version
        run: |
          APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "version=${APP_VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # 发布 Beta 预览版（prerelease）到固定 tag nightly，附更新日志
      - name: Publish nightly beta prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly            # 固定 tag，每次构建覆盖同一个「最新预览版」
          name: ${{ steps.version.outputs.version }}
          prerelease: true
          body: |
            ## 📦 更新日志（commit `${{ github.sha }}`）

            **版本**：`${{ steps.version.outputs.version }}`

            ### ✨ 新增功能
            - 🔓 工具审批「全部允许」：AI 使用所有工具（含 MCP）不再弹确认框（ask_user 除外）
            - 🔁 限流自动重试（tpm/rpm）：固定间隔 / 指数退避 / 随机抖动，可配置最大重试次数
            - ▶️ 继续生成：AI 被停止/中断后从半截回复继续生成（历史中段对话也能）
            - 🔥 Firebase 可选：无 google-services.json 也能构建运行

            ### 🎨 界面改动
            - 扩展管理页新增「其他」入口（自动重试设置页）
            - 工作区详情页新增「其他 / 全部允许」
            - 关于页去掉官网，GitHub / 许可证指向本仓库
            - 设置页帮助文档 / 分享文案指向本仓库，更新检查禁用

            ### 📦 其他
            - 包名 `app.ai.rune`，完整记录见 [CHANGELOG.md](https://github.com/Rune-cn/rikkahub/blob/master/CHANGELOG.md)

            > ⚠️ **Beta 预览版**，可能不稳定，仅供测试。
          files: app/build/outputs/apk/release/*.apk
