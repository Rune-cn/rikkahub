name: Daily Build

on:
  # 推送到 master 时自动构建 APK
  push:
    branches: [master]
  # 每天 UTC 09:00、18:00 触发（北京时间 17:00、次日 02:00）
  schedule:
    - cron: '0 9,18 * * *'
  # 也支持手动触发（可选择发布 Beta 预览版或正式版）
  workflow_dispatch:
    inputs:
      release_type:
        description: '发布类型（nightly = Beta 预览版；stable = 正式版）'
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable

jobs:
  # 检查过去 24 小时内是否有新提交，没有则跳过构建，避免重复打包
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          # 手动触发时无条件构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定时触发：仅当过去 24 小时内有新提交才构建
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      # 与 Android Studio 自带的 JetBrains Runtime 21 保持一致
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          # jetbrains 安装器通过 GitHub API 查询版本，带上 token 避免被限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          # 解码base64编码的keystore文件
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key

          # 写入签名配置到local.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties

          # 可选：存在 Google Services 配置才写入（没有也能构建，Firebase 功能会被禁用）
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          fi

      - name: Gradle Build
        run: |
          chmod +x gradlew
          # 正式版：versionName 不带 commit 短 SHA
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.release_type }}" = "stable" ]; then
            EXTRA_ARGS="-PversionWithSha=false"
          fi
          ./gradlew assembleGithubRelease $EXTRA_ARGS

      # 计算版本号：应用版本 + 构建 commit 短 SHA（如 2.5.6-a3ea1cd1）
      - name: Compute release version
        id: version
        run: |
          APP_VERSION=$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          if [ "${{ github.event.inputs.release_type }}" = "stable" ]; then
            VERSION="${APP_VERSION}"                # 正式版：纯版本号（如 2.5.6）
          else
            VERSION="${APP_VERSION}-${SHORT_SHA}"   # 预览版：版本号-commit（如 2.5.6-a3ea1cd1）
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # 发布：
      # - nightly（默认）：Beta 预览版（prerelease），tag 固定 nightly，版本号带 commit
      # - stable：正式版（非 prerelease），tag 为纯版本号（如 2.5.6）
      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ github.event.inputs.release_type == 'stable' && steps.version.outputs.app_version || 'nightly' }}
          name: ${{ steps.version.outputs.version }}
          prerelease: ${{ github.event.inputs.release_type != 'stable' }}
          body: |
            ## 📦 RikkaHub ${{ steps.version.outputs.version }}

            **版本**：`${{ steps.version.outputs.version }}`

            更新内容：

            ### ✨ 新变化
            - **同步上游 3.x 全量架构**：全新 Agent 事件流生成引擎、设置存储重构（SettingsFields）、github/play 双构建渠道、Material 3 Expressive 界面
            - **运行日志页**：App 启动 / 搜索 / 崩溃自动记录，设置 → 关于 → 运行日志
            - **对话内链接操作面板**：正文/引用/搜索结果里的链接点击后可选「浏览器打开 / 内嵌打开 / 分享 / 复制链接」

            ### ⬆️ 功能升级
            - **可配置重试升级**：固定 / 指数退避 / 随机抖动三种间隔策略真正运行时生效；重试设置独立成「重试」页，新增总开关与「一键恢复默认」；状态只显示「重试中…」
            - **更新检查升级**：改为正式版检测（版本号比较）；GitHub API + 302 双通道（限流自动降级）；关于页「检查更新」手动入口
            - **子 Agent 完善**：消息视觉区分、统一更名「子 Agent」
            - **设置搜索打磨**：顶栏直搜、整页搜索模式

            ### 🎨 界面与文案
            - 扩展管理重组：快捷消息 / 提示词 / 技能 / 工作区 / 工具调用 / AI 工作流 / 重试 / 子 Agent
            - 繁中（zh-rTW）补齐重试翻译；QQ 群入口；捐赠新增「爱发电 · Rune」

            完整记录见 [CHANGELOG.md](https://github.com/Rune-cn/rikkahub/blob/master/CHANGELOG.md)

            ${{ github.event.inputs.release_type == 'stable' && '> ✅ **正式版（Stable）**' || '> ⚠️ **Beta 预览版**，可能不稳定，仅供测试。' }}
          files: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/mapping/githubRelease/mapping.txt
